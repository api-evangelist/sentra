aid: sentra
name: Sentra
description: 'Sentra is a cloud-native data security platform (DSPM) that discovers, classifies,
  and governs sensitive data at petabyte scale across cloud and SaaS environments, with a focus
  on AI-readiness and preventing sensitive data exposure. The platform gives security teams
  visibility into where data lives, reduces data sprawl, and monitors data access and posture.
  Sentra was surfaced as a portfolio company of Bessemer Venture Partners. It operates a public
  Trust Center but does not publish a public developer API, SDKs, or open documentation; its
  product documentation is gated behind an authenticated application login.'
